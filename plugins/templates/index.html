<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>视频工具箱</title>

		<style>
			* {
			margin: 0;
			padding: 0
		}
		img {
			border: 0;
			vertical-align: middle
		}

		body {
			-webkit-font-smoothing: antialiased;
			background-color: #fff;
			font: 16px/1.5 Microsoft YaHei, Heiti SC, tahoma, arial, Hiragino Sans GB, "\5B8B\4F53", sans-serif;
			color: #222
		}

		a {
			color: #666;
			text-decoration: none;
			transition: all 0.3s
		}

		a:hover {
			color: #c81623;
			transition: all 0.3s
		}

		.content {
		position: relative;
		margin: 0 auto;
		width: 1000px;
		height: 900px;
		/* border: 1px solid #ff0000; */
		}

		.content>div {

			width: 300px;
			height: 250px;
			margin: 20px 16.6px 10px 16.6px;
			box-sizing: border-box;
			padding: 30px;
			border-radius: 20px;
			transition: all 0.4s;
		}
		 .content>div:nth-child(n-4){
			 float: left;

		 }

		.content>div:nth-child(n+4){
			float: right;
			top: 280px;
		}


		.content>div:hover {
			box-shadow: 0px 20px 50px -14px rgba(0, 0, 0, 0.2);
			transform: translateY(-2px);
		}
		#uploadF1>div>button:hover{
			box-shadow: 0px 20px 50px -14px rgba(0, 0, 0, 0.2);
			transform: translateY(-1px);

		}

		.content>div>.img {
			width: 120px;
			height: 120px;
			margin: 0 60px;
		}

		.content>div>h2 {
			/* font-weight: 400; */
			/* margin-top: 20px; */
			text-align: center;
		}

		.one_out{

			/* position:absolute; */
			animation: one_move_out 1s cubic-bezier(0.4, 0, 1, 1)  forwards;
			/* animation-delay: 0.8s; */

		}
		/* .one_in{
			animation: one_move_out 1s cubic-bezier(0.4, 0, 1, 1) reverse forwards ;
		} */
		.two_out{
			/* position:absolute; */
			animation: two_move_out 1s cubic-bezier(0.4, 0, 1, 1) forwards;
			/* animation-delay: 0.8s; */
		}
		/* .two_in{
			animation: two_move_out 0.1s cubic-bezier(0.4, 0, 1, 1) reverse forwards ;
		} */
		.three_out{
			/* position:absolute; */
			animation: three_move_out 1s cubic-bezier(0.4, 0, 1, 1) forwards;
			/* animation-delay: 0.8s; */

		}
		/* .three_in{
			animation: three_move_out 0.1s cubic-bezier(0.4, 0, 1, 1) reverse forwards ;
		} */
		.four_out{
			/* position:absolute; */
			animation: four_move_out 1s cubic-bezier(0.4, 0, 1, 1) forwards;
			/* animation-delay: 0.8s; */
		}
		/* .four_in{
			animation: four_move_out 0.1s cubic-bezier(0.4, 0, 1, 1) reverse forwards;
		} */
		.five_out{
			/* position:absolute; */
			animation: five_move_out 1s cubic-bezier(0.4, 0, 1, 1) forwards;
			/* animation-delay: 0.8s; */
		}
		/* .five_in{
			animation: five_move_out 0.1s cubic-bezier(0.4, 0, 1, 1) reverse forwards;
		} */
		.six_out{
			/* position:absolute; */
			animation: six_move_out 1s cubic-bezier(0.4, 0, 1, 1) forwards;
			/* animation-delay: 0.8s; */
		}
		/* .six_in{
			animation: six_move_out 0.1s cubic-bezier(0.4, 0, 1, 1) reverse forwards;
		} */

		@keyframes one_move_out {
			from {

				position:absolute;
				top: 20px;
				 left:16px;

			}
			to {
				position:absolute;
				left:-1000%;
			}
		}
		@keyframes two_move_out {
			from {
				position:absolute;
				top: 20px;
				 left:332px;

			}
			to {
				position:absolute;
				left:-1000%;
			}
		}
		@keyframes three_move_out {
			from {
				position:absolute;
				top: 20px;
				left:664px;

			}
			to {
				position:absolute;
				left:-1000%;
			}
		}
		@keyframes four_move_out {
			from {
				position:absolute;
				 left:16px;
				top: 280px;
			}
			to {
				position:absolute;
				left:-1000%;
				top: 280px;
			}
		}
		@keyframes five_move_out {
			from {
				position:absolute;
				 left:332px;
				top: 280px;
			}
			to {
				position:absolute;
				left:-1000%;
				top: 280px;
			}
		}
		@keyframes six_move_out {
			from {
				position:absolute;
				left:664px;
				top: 280px;
			}
			to {
				position:absolute;
				left:-1000%;
				top: 280px;
			}
		}

/* 		.selected{
			float: left;
			width: 300px;
			height: 95px;
			margin: 20px 0 10px 10px;
			box-sizing: border-box;
			padding: 30px;
			border-radius: 20px;
		} */
		.content>.selected{
			height: 90px;
			/*
			变换所需要的时间
			transition: all 0.1;

			*/
		}
		.content>div>.remove{
			margin-top: 5px;
		}

		.hidDiv {
			position: absolute;
			overflow: hidden;
			text-align: center;
			opacity: 0.8;
			border: 0.5px solid #eee;
			border-radius: 8px;
			top: 50%;
			left: 45%;
			transform: translate(-50%, -50%);

		}
		.fileContext{
			width: 600px;
			height: 400px;
		}
		/* input{

			width: 500px;
			margin-bottom: 10px;
		} */
		.up_in{
			position: absolute;

			animation : move_in 1s cubic-bezier(0.4, -0.375, 1, 1) forwards;

		}
		@keyframes move_in {
			from {
				left: -15%;
			}
			80%{
				left: 51%;
			}

			90%{
				left: 49%;
			}
			to {
				left: 50%;
			}

		}
		.workspace {
			width: 853px;
			height: 480px;
			border: 2px dashed;
			text-align: center;
			margin: 20px;
			background: rgba(0, 0, 0, 0.5);
			background-image: repeating-linear-gradient(30deg, hsla(0, 0%, 100%, .1), hsla(0, 0%, 100%, .1) 7px, transparent 0, transparent 14px);
		}

		.file {
			position: relative;
			margin: 240px 300px;
			display: inline-block;
			background: #D0EEFF;
			border: 1px solid #99D3F5;
			border-radius: 4px;
			padding: 4px 12px;
			overflow: hidden;
			color: #1E88C7;
			text-decoration: none;
			text-indent: 0;
			line-height: 20px;
			z-index: 10;
		}

		.file2 {
			position: relative;
			margin-bottom: 20px;
			display: inline-block;
			background: #D0EEFF;
			border: 1px solid #99D3F5;
			border-radius: 4px;
			padding: 4px 12px;
			overflow: hidden;
			color: #1E88C7;
			text-decoration: none;
			text-indent: 0;
			line-height: 20px;
		}

		.file input {
			position: absolute;
			font-size: 100px;
			right: 0;
			top: 0;
			opacity: 0;
		}

		.file:hover {
			background: #AADFFD;
			border-color: #78C3F3;
			color: #004974;
			text-decoration: none;
		}

		.file2:hover {
			background: #AADFFD;
			border-color: #78C3F3;
			color: #004974;
			text-decoration: none;
		}

		.img {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.upload {
			height: 30px;
			margin: 20px auto;
		}
		.controller-corner {
			width: 10px;
			height: 10px;
			background-color: rgb(170, 214, 255);
			position: absolute;
      	}
	</style>
	</head>
	<body>
		<article>
			<div class="content w">
				<div style="background-color: #9dc1fa; color: #2e6df6;" class="div1" id="one">
					<div class="img" id="img1"><img src="http://localhost:5000/api/images/watermark.png" alt=""></div>
					<h2 id="des1">视频台标消除</h2>
				</div>
				<div style="background-color: #f7d79c; color: #dd932c;" class="div2" id="two">
					<div class="img" id="img2"><img src="http://localhost:5000/api/images/watermark.png" alt=""></div>
					<h2 id="des2" >视频隐形水印</h2>
				</div>
				<div style="background-color: #cf97e3;color: #961dc0;" class="div3" id="three">
					<div class="img" id="img3"><img src="http://localhost:5000/api/images/watermark.png" alt=""></div>
					<h2 id="des3" >视频字幕消除</h2>
				</div>
				<div style="background-color: #c3e1b5; color: #65bb3b;" class="div4" id="four">
					<div class="img" id="img4"><img src="http://localhost:5000/api/images/watermark.png" alt=""></div>
					<h2 id="des4" >敬请期待</h2>
				</div>
				<div style="background-color: #ecaea5; color: #eb553e;" class="div5" id="five">
					<div class="img" id="img5"><img src="http://localhost:5000/api/images/watermark.png" alt=""></div>
					<h2 id="des5">敬请期待</h2>
				</div>
				<div style="background-color: #ade6ef; color: #47b7c9;" class="div6" id="six">
					<div class="img" id="img6"><img src="http://localhost:5000/api/images/watermark.png" alt=""></div>
					<h2 id="des6" >敬请期待</h2>
				</div>
			</div>

			<div class="hidDiv" id="uploadF1" style="display: none;" >
				<div class="workspace w" id="workspace1">
					<div id="box" style="position: absolute; margin: 0; overflow: hidden; border: 1px dashed rgb(0, 0, 0);background: rgba(110, 185, 255, 0.452);height: 100px;width:200px;">
						拖动和调整大小来覆盖台标区域
					</div>
					<img class="img" id="preview1" style="display: block;"></img>
					<div id="downBox1"
						 style="display:none;position: absolute;top: 20px;"><a
							class="file" id="download1"></a>
					</div>

				</div>

				<div class="upload w">
					<span>选择文件</span>
					<progress id="progressBar1" value="0" max="100"
							  style="width:400px;display:none;"></progress>
					<span id="percentage1"></span><span id="time"></span>
					<input type="file" name="file" id="file1"> <a
						onclick="UploadFile(`uploadF1`);">上传</a> <a
						onclick="eraseLogo(`uploadF1`);">消除台标</a>
				</div>
			 	<div class="uploadDiv">
			 		<button class="callback file2" id="back1">返回</button>
			 	</div>

			</div>

			<div class="hidDiv" id="uploadF2" style="display: none;" >
				<div class="workspace w">
					<img class="img" id="preview2" style="display: block;"></img>
					<div id="downBox2"
						 style="display:none;position: absolute;top: 20px;"><a
							class="file" id="download2"></a>
					</div>

				</div>

				<div class="upload w">
					<span>水印文字：</span>
					<input type="text" name="text" id="text">
					<progress id="progressBar2" value="0" max="100"
							  style="width:200px;display:none;"></progress>
					<span id="percentage2"></span><span id="time"></span>
					<input type="file" name="file" id="file2"> <a
						onclick="UploadFile(`uploadF2`);">上传</a> <a
						onclick="addWaterMark(`uploadF2`);">添加水印</a>
				</div>
			 	<div class="uploadDiv">
			 		<button class="callback file2" id="back2">返回</button>
			 	</div>

			</div>

		<div class="hidDiv" id="uploadF3" style="display: none;" >
			<div class="workspace w" id="workspace3">
				<div id="tbox" style="position: absolute; margin: 0; overflow: hidden; border: 1px dashed rgb(0, 0, 0);background: rgba(110, 185, 255, 0.452);height: 100px;width:500px;">
					拖动和调整大小来覆盖字幕区域
				</div>
				<img class="img" id="preview3" style="display: block;"></img>
				<div id="downBox3"
					 style="display:none;position: absolute;top: 20px;"><a
						class="file" id="download3"></a>
				</div>

			</div>

			<div class="upload w">
				<span>选择文件 </span>
				<progress id="progressBar3" value="0" max="100"
						  style="width:400px;display:none;"></progress>
				<span id="percentage3"></span><span id="time"></span>
				<input type="file" name="file" id="file3"> <a
					onclick="UploadFile(`uploadF3`);">上传 </a> <a
					onclick="eraseSubtitle(`uploadF3`);"> 消除字幕</a>
			</div>
			 <div class="uploadDiv">
				 <button class="callback file2" id="back3">返回</button>
			 </div>

		</div>

		</article>
		<script type="text/javascript" src="http://localhost:5000/api/js/index.js"></script>
	</body>

</html>
