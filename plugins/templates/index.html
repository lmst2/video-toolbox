<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频工具箱</title>
    <style>
        /* ————————————————————————初始化———————————————————————————— */

        * {
            margin: 0;
            padding: 0
        }

        em,
        i {
            font-style: normal
        }

        li {
            list-style: none
        }

        img {
            border: 0;
            vertical-align: middle
        }

        button {
            cursor: pointer
        }

        a {
            color: #666;
            text-decoration: none
        }

        a:hover {
            color: #c81623
        }

        button,
        input {
            font-family: Microsoft YaHei, Heiti SC, tahoma, arial, Hiragino Sans GB, "\5B8B\4F53", sans-serif
        }

        body {
            -webkit-font-smoothing: antialiased;
            background-color: #fff;
            font: 16px/1.5 Microsoft YaHei, Heiti SC, tahoma, arial, Hiragino Sans GB, "\5B8B\4F53", sans-serif;
            color: #222
        }

        .hide,
        .none {
            display: none
        }

        .clearfix:after {
            visibility: hidden;
            clear: both;
            display: block;
            content: ".";
            height: 0
        }

        .clearfix {
            *zoom: 1
        }

        /* —————————————————————————我的css——————————————————————————— */

        .w {
            width: 1200px;
            margin: 0 auto;
        }

        span {
            background: white;
        }

        ul > li > ul {
            display: block;
        }

        input[type=checkbox] {
            display: none;
        }

        ul li input[type=checkbox]:checked + ul {
            display: none;
        }

        /* ————————————————————————头部区域———————————————————————————— */

        header > :first-child {
            background: #506c90;
            height: 52px;
        }

        header > :first-child > div > img {
            margin-top: 8px;
        }

        header > :nth-child(2) {
            background: #e8ecf3;
            height: 103px;
        }

        header > :nth-child(2) > h2 {
            text-align: center;
            line-height: 103px;
            color: #667ca3;
            font-weight: 400;
        }

        /* ————————————————————————内容区域———————————————————————————— */

        .content {
            height: 650px;
        }

        .content > a > div {
            float: left;
            width: 300px;
            height: 250px;
            margin: 35px 0 40px 75px;
            box-sizing: border-box;
            padding: 30px;
            border-radius: 20px;
            transition: all 0.4s;
        }

        .content > a > div:hover {
            box-shadow: 0px 20px 50px -14px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .content > a > div > .img {
            width: 120px;
            height: 120px;
            margin: 0 60px;
        }

        .content > a > div > h2 {
            /* font-weight: 400; */
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
