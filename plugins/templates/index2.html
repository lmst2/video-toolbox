    <script type="text/javascript">
        //图片上传
        var xhr;
        var fname;

        //上传文件方法
        function UploadFile() {
            var fileObj = document.getElementById("file").files[0]; // js 获取文件对象
            var url = "http://localhost:5000" + "/api/v1/upload"; // 接收上传文件的后台地址

            var form = new FormData(); // FormData 对象
            form.append("file", fileObj); // 文件对象

            xhr = new XMLHttpRequest();  // XMLHttpRequest 对象
            xhr.open("post", url, true); //post方式，url为服务器请求地址，true 该参数规定请求是否异步处理。
            xhr.onload = uploadComplete; //请求完成
            xhr.onerror = uploadFailed; //请求失败

            xhr.upload.onprogress = progressFunction;//【上传进度调用方法实现】
            xhr.upload.onloadstart = function () {//上传开始执行方法
                ot = new Date().getTime();   //设置上传开始时间
                oloaded = 0;//设置上传开始时，以上传的文件大小为0
            };

            xhr.send(form); //开始上传，发送form数据
        }

        //上传成功响应
        function uploadComplete(evt) {
            //服务断接收完文件返回的结果

            var data = JSON.parse(evt.target.responseText);
            var progressBar = document.getElementById("progressBar");
            var percentageDiv = document.getElementById("percentage");
            var fileUploader = document.getElementById("file");
            var preview = document.getElementById("preview");
            var download = document.getElementById("download");
            var downBox = document.getElementById("downBox");
            if (data.success) {
                alert("上传成功！");
                console.log(data);
                progressBar.style.display = "none";
                fileUploader.style.display = "inline";
                percentageDiv.innerHTML = '完成';
                fname = data.filename;
            } else {
                alert("上传失败！");
                progressBar.style.display = "none";
                fileUploader.style.display = "inline";
                percentageDiv.innerHTML = '失败';
            }
            preview.style.display = "none";
            downBox.style.display = "none";

        }

        //上传失败
        function uploadFailed(evt) {
            alert("上传失败！");
        }

        //取消上传
        function cancelUploadFile() {
            xhr.abort();
        }

        //添加水印
        function addWaterMark() {
            var text = document.getElementById("text").value;
            if (text.replace(/(^s*)|(s*$)/g, "").length == 0) {
                alert("请输入水印文字！")
            } else if (fname) {
                var xmlhttp = new XMLHttpRequest();   // new HttpRequest instance
                var theUrl = "http://localhost:5000/api/video/admin/v1.0/add/watermark";
                xmlhttp.open("POST", theUrl, true);
                xmlhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                console.log(JSON.stringify({
                    "video_name": fname,
                    "text": text
                }));
                xmlhttp.onload = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        var res = JSON.parse(this.responseText);
                        var down = document.getElementById("download");
                        var downBox = document.getElementById("downBox");
                        down.innerHTML = "处理中";
                        downBox.style.display = "block";
                        console.log(res)
                        previewIMG();
                        checkResult(res);
                    }
                }
                xmlhttp.send(JSON.stringify({
                    "video_name": fname,
                    "text": text
                }));
            } else {
                alert('请先上传文件!');
            }
        }

        function checkResult(data) {
            var xmlhttp = new XMLHttpRequest();   // new HttpRequest instance
            var theUrl = "http://localhost:5000/api/video/admin/v1.0/add/watermark/" + data.Request_id;
            var download = document.getElementById("download");
            var downBox = document.getElementById("downBox");
            xmlhttp.open("GET", theUrl, true);
            xmlhttp.onload = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var res = JSON.parse(this.responseText);
                    console.log(res)
                    if (res.Status == "PROCESS_SUCCESS") {
                        var downAPI = "http://localhost:5000/api/v1/download/";
                        download.href = downAPI + res.Result.video_name;
                        download.innerHTML = "下载视频";
                        downBox.style.display = "block";
                        flag = false;
                    } else if (res.Status == "PROCESS_FAILED") {
                        download.innerHTML = "处理失败: " + res.ErrorMessage;
                        downBox.style.display = "block";
                        flag = false;
                    } else {
                        setTimeout(checkResult, 20000, data);
                    }
                }
            }
            xmlhttp.send(null);
        }


        function previewIMG() {
            var text = document.getElementById("text").value;
            var xmlhttp = new XMLHttpRequest();   // new HttpRequest instance
            var theUrl = "http://localhost:5000/api/video/admin/v1.0/add/watermark/preview/" + fname + "|" + text;
            xmlhttp.open("GET", theUrl, true);
            xmlhttp.onload = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var res = JSON.parse(this.responseText);
                    console.log(res)
                    if (res.success) {
                        var preview = document.getElementById("preview");
                        preview.src = res.watermark
                        preview.style.display = "block";
                    }
                }
            }
            xmlhttp.send(null);
        }


        //上传进度实现方法，上传过程中会频繁调用该方法
        function progressFunction(evt) {
            var progressBar = document.getElementById("progressBar");
            var percentageDiv = document.getElementById("percentage");
            var fileUploader = document.getElementById("file");
            // event.total是需要传输的总字节，event.loaded是已经传输的字节。如果event.lengthComputable不为真，则event.total等于0
            progressBar.style.display = "inline";
            fileUploader.style.display = "none";
            if (evt.lengthComputable) {//
                progressBar.max = evt.total;
                progressBar.value = evt.loaded;
                percentageDiv.innerHTML = Math.round(evt.loaded / evt.total * 100) + "%";
            }
            // var time = document.getElementById("time");

            //     speed = speed / 1024;
            //     units = 'M/s';
            // }
            // speed = speed.toFixed(1);
            // //剩余时间
            // var resttime = ((evt.total - evt.loaded) / bspeed).toFixed(1);
            // time.innerHTML = '，S：' + speed + units + '，ETA：' + resttime + 's';
            // if (bspeed == 0) time.innerHTML = '上传已取消';
        }
