<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .div0{
            width: 400px;
            height: 400px;
            border: 1px solid #000000;
            position: relative;
            left:100px;
            top:100px;
        }
        .div1
        {
            width: 200px;
            height: 200px;
            background-color: rgba(255,0,0,0.4);
            position: absolute;
            display: none;
        }
    </style>
</head>
<body>
<div class="div0">
    <div class="div1"></div>
</div>
    <script>
       /*
        1\拖拽div碰撞父容器的div边框时,父容器div对应的边框变成红色,不碰撞恢复
        2\鼠标进入大div时,显示小div,鼠标在大div中移动时,小div以鼠标中心移动,当小div超出时禁止超出
        鼠标离开时,隐藏小div
       */
        var div0,div1;
        init();
        function init() {
            div0=document.querySelector(".div0");
            div1=document.querySelector(".div1");
            div0.addEventListener("mouseenter",mouseEnterHandler);
            div0.addEventListener("mouseleave",mouseEnterHandler);
        }
 
        function mouseEnterHandler(e) {
            if(e.type==="mouseenter"){
                div1.style.display="block";
                div0.addEventListener("mousemove",mouseMoveHandler);
            }else if(e.type==="mouseleave"){
                div1.style.display="none";
                div0.removeEventListener("mousemove",mouseMoveHandler);
            }
        }
 
        function mouseMoveHandler(e) {
//            console.log(e.clientX,e.clientY);
//            div0,父容器,获取父容器相对视口范围对象
            var range=div0.getBoundingClientRect();
//            div1的位置  当前鼠标相对视口的坐标-当前div1的一半宽度-父容器相对视口距离
            div1.style.left=e.clientX-div1.offsetWidth/2-range.left+"px";
            div1.style.top=e.clientY-div1.offsetHeight/2-range.top+"px";
//            div1.style.left=e.pageX-div1.offsetWidth/2-range.left-document.documentElement.scrollLeft+"px";
//            div1.style.top=e.pageY-div1.offsetHeight/2-range.top-document.documentElement.scrollTop+"px";
//            if(div1.offsetLeft<=0){
//                div0.style.borderLeft="1px solid #FF0000";
//            }else{
//                div0.style.borderLeft="1px solid #000000";
//            }
 
            if(div1.offsetLeft<=0){
                div1.style.left="0px";
            }
            if(div1.offsetTop<=0){
                div1.style.top="0px";
            }
            if(div1.offsetLeft>=div0.clientWidth-div1.clientWidth){
                div1.style.left=div0.clientWidth-div1.clientWidth+"px";
            }
            if(div1.offsetTop>=div0.clientHeight-div1.clientHeight){
                div1.style.top=div0.clientHeight-div1.clientHeight+"px";
            }
        }
    </script>
</body>
</html>
